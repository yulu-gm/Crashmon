<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crashmon · 星野营地场景检查</title><link rel="stylesheet" href="/scene-lab.css"><script type="module" src="/scene-lab.js"></script></head>
<body><canvas id="scene-canvas" tabindex="0" aria-label="可移动的模块化星野营地预览"></canvas>
<header class="panel"><a href="/">◒ CRASHMON</a><h1>星野营地 · 场景预览</h1><p>WASD / 方向键或点击沙地移动</p><p id="status" role="status">正在载入场景…</p></header>

<footer class="panel"><span>地面 / 独立物件 / 角色遮挡 / 岸边前景</span><nav><a href="/animation-lab">角色动作</a><a href="/">进入游戏</a></nav></footer>
</body></html>
